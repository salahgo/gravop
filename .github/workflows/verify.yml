name: Verify package and numerical primitives
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[all]' wheel
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Import installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import gravop, statecond
          from pathlib import Path
          for module in (gravop, statecond):
              assert 'site-packages' in Path(module.__file__).parts, module.__file__
          PY
      - name: Independent numerical and release contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          python -m pytest -q
          tests/test_conditional.py tests/test_conditional_refinement.py
          tests/test_dyadic.py tests/test_forecast_final.py
          tests/test_release_workflow.py tests/test_fresh_confirmation.py
      - name: Release metadata is well formed
        # .zenodo.json and CITATION.cff sit at the root of the source release;
        # a development checkout keeps the built release in a subdirectory.
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json, pathlib, yaml
          root = next(p for p in (pathlib.Path('.'), pathlib.Path('public-artifacts/github'))
                      if (p / '.zenodo.json').exists())
          print(f'checking release metadata in {root}')
          # Zenodo reads this file when a GitHub release is archived and
          # rejects a malformed ORCID or DOI, so no placeholder may remain.
          zen = (root / '.zenodo.json').read_text()
          json.loads(zen)
          assert '<' not in zen, '.zenodo.json carries an unresolved placeholder'
          cff = yaml.safe_load((root / 'CITATION.cff').read_text())
          assert cff['cff-version'] == '1.2.0', cff.get('cff-version')
          for key in ('type', 'title', 'version', 'authors', 'license',
                      'repository-code', 'date-released'):
              assert cff.get(key), f'CITATION.cff is missing {key}'
          print('CITATION.cff and .zenodo.json are well formed')
          PY

  acceptance:
    runs-on: ubuntu-latest
    # The full gate suite reads the archival record, which is deposited
    # separately: results/ is not tracked in this repository, and
    # the gates that read them fail rather than skip when they are absent. The
    # job above therefore runs the contracts the source tree alone can
    # establish. Set the repository variable ZENODO_RECORD_URL to the archive
    # asset once the deposit exists and this job runs everything against it.
    if: vars.ZENODO_RECORD_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and unpack the archival record
        run: |
          curl -fsSL "${{ vars.ZENODO_RECORD_URL }}" -o archive.zip
          # results/ only: the record's own manifest and metadata stay out of
          # the source tree, which carries its own.
          unzip -q archive.zip 'results/*' -d .
          test -d results || { echo 'archive has no results/'; exit 1; }
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[all]'
      - name: Acceptance gates
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest tests/ -q
