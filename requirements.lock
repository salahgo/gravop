# Frozen environment for the results in this repository.
#
# It is a record of what produced the numbers, not an install script: `torch`
# was installed from a locally cached wheel of 2.13.0+cu130 (SHA-256 below),
# and the CUDA packages are specific to that build. To reproduce the exact
# environment, take torch 2.13.0+cu130 from the PyTorch cu130 index:
#
#     pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cu130
#
# The documented install path is
#
#     pip install -e ".[all]"
#
# which, measured end to end from a fresh clone, took 978 s and 5.9 GB and
# resolved to torch 2.14.0+cu130 and numpy 2.5.3 rather than the 2.13.0 and
# 2.5.2 recorded here. Nothing in the results depends on that difference --
# the gates pass on both -- but the difference is real and is stated rather
# than hidden.
